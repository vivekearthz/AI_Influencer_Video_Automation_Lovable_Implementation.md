project_id = "ai-influencer-video-automation"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions]
enabled = true

# The orchestrator is invoked by pg_cron / GitHub Actions / any external
# cron pinger, never by a logged-in user, so it authenticates via a shared
# secret header (ORCHESTRATOR_CRON_SECRET) instead of a Supabase JWT.
[functions.campaign-orchestrator]
verify_jwt = false

# Inbound webhooks come from third-party providers (Meta, WhatsApp, email,
# social publishers) that cannot present a Supabase JWT. Each one verifies
# its own HMAC signature instead (see supabase/functions/_shared/webhookSignature.ts).
[functions.webhooks-whatsapp]
verify_jwt = false
[functions.webhooks-social]
verify_jwt = false
[functions.webhooks-email]
verify_jwt = false
[functions.webhooks-ai]
verify_jwt = false

[edge_runtime]
enabled = true
policy = "oneshot"
