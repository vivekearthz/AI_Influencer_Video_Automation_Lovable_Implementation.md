project_id = "influenceos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5174"
additional_redirect_urls = ["http://localhost:5174"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[functions]
enabled = true

# Razorpay calls this webhook directly and cannot present a Supabase JWT; it
# verifies its own HMAC signature instead (see _shared/razorpay.ts).
[functions.razorpay-webhook]
verify_jwt = false

[edge_runtime]
enabled = true
policy = "oneshot"
