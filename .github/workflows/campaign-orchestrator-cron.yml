name: Campaign orchestrator cron

# Alternative to the pg_cron/pg_net setup in supabase/cron/ — useful when
# pg_cron isn't available on your Supabase plan/self-hosted instance, or you
# simply prefer scheduling from GitHub. See supabase/cron/README.md for the
# full comparison of mechanisms.

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

concurrency:
  group: campaign-orchestrator-cron
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger campaign-orchestrator sweep
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          ORCHESTRATOR_CRON_SECRET: ${{ secrets.ORCHESTRATOR_CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ] || [ -z "$ORCHESTRATOR_CRON_SECRET" ]; then
            echo "SUPABASE_PROJECT_URL and/or ORCHESTRATOR_CRON_SECRET repository secrets are not set. Skipping." >&2
            exit 1
          fi

          http_status=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST "${SUPABASE_PROJECT_URL%/}/functions/v1/campaign-orchestrator" \
            -H "Content-Type: application/json" \
            -H "X-Cron-Secret: ${ORCHESTRATOR_CRON_SECRET}" \
            -d '{"trigger":"github-actions"}')

          echo "HTTP status: $http_status"
          cat /tmp/response.json
          echo

          if [ "$http_status" -ge 300 ]; then
            echo "campaign-orchestrator returned a non-success status." >&2
            exit 1
          fi
